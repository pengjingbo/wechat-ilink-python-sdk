[project]
name = "wechat-ilink-sdk"
version = "0.2.0"
description = "Python SDK for WeChat iLink Bot protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "pengjingbo" },
]
keywords = ["ilink", "python", "sdk", "wechat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "qrcode>=8.0",
]

[project.urls]
Homepage = "https://github.com/pengjingbo/wechat-ilink-python-sdk"
Repository = "https://github.com/pengjingbo/wechat-ilink-python-sdk"
Issues = "https://github.com/pengjingbo/wechat-ilink-python-sdk/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "twine>=6.1.0",
]
release = [
    "build>=1.2.2",
    "twine>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/ilink",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ilink"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
