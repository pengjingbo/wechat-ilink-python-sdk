name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check PyPI for existing version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          project_name = "wechat-ilink-sdk"
          pyproject_path = Path("pyproject.toml")
          data = tomllib.loads(pyproject_path.read_text(encoding="utf-8"))
          version = data["project"]["version"]
          url = f"https://pypi.org/pypi/{project_name}/json"

          try:
              with urllib.request.urlopen(url) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  payload = {"releases": {}}
              else:
                  raise

          releases = payload.get("releases", {})
          should_publish = str(version not in releases).lower()

          github_output = Path(__import__("os").environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"should_publish={should_publish}\n")

          print(f"Resolved version: {version}")
          print(f"Publish required: {should_publish}")
          PY

  build:
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        run: uv run python -m build

      - name: Validate package metadata
        run: uv run twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs:
      - check-version
      - build
    if: needs.check-version.outputs.should_publish == 'true'
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-skipped:
    runs-on: ubuntu-latest
    needs:
      - check-version
      - build
    if: needs.check-version.outputs.should_publish != 'true'
    steps:
      - name: Report skipped publish
        run: |
          echo "Version ${{ needs.check-version.outputs.version }} already exists on PyPI."
          echo "Skipping publish step."
